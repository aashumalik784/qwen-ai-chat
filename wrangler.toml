name = "aashu-ai-chat"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
NEXT_PUBLIC_APP_NAME = "Aashu AI Chat"

# ⚠️ IMPORTANT: API keys ko wrangler.toml mein MAT likhein!
# Security ke liye saari API keys Cloudflare Dashboard se add karein:
# 
# Cloudflare Dashboard → Settings → Variables and secrets → Add Secret
#
# Required Secrets:
# - GROQ_API_KEY
# - GEMINI_API_KEY  
# - COHERE_API_KEY
# - OPENROUTER_API_KEY
# - CEREBRAS_API_KEY
# - DEEPSEEK_API_KEY
# - OPENAI_API_KEY
